openapi: 3.0.3
info:
  title: Book Management API
  description: API quản lý sách (Book Management System) cung cấp các endpoint để thêm, sửa, xóa và truy vấn thông tin sách.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
  - url: https://bookmanagementv2.vercel.app/api/v1
    description: Production Server  
paths:
  /books:
    get:
      summary: Lấy danh sách tất cả các cuốn sách
      description: Trả về danh sách sách hiện có trong hệ thống. Có thể hỗ trợ phân trang sau này.
      responses:
        '200':
          description: Thành công. Trả về mảng các cuốn sách.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      summary: Thêm một cuốn sách mới
      description: Tạo mới một bản ghi sách trong hệ thống.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: Tạo thành công. Trả về thông tin sách vừa được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Dữ liệu đầu vào không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /books/{bookId}:
    parameters:
      - in: path
        name: bookId
        required: true
        schema:
          type: string
        description: ID (Định danh) duy nhất của cuốn sách
    get:
      summary: Lấy thông tin chi tiết một cuốn sách
      description: Lấy thông tin chi tiết của một cuốn sách dựa trên ID cung cấp.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Không tìm thấy sách với ID này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Cập nhật thông tin sách
      description: Cập nhật toàn bộ nội dung thông tin của một cuốn sách.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Dữ liệu đầu vào không hợp lệ.
        '404':
          description: Không tìm thấy sách để cập nhật.
    delete:
      summary: Xóa một cuốn sách
      description: Xóa cuốn sách khỏi hệ thống dựa trên ID.
      responses:
        '204':
          description: Xóa thành công, không trả về nội dung (No Content).
        '404':
          description: Không tìm thấy sách để xóa.

components:
  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - author
      properties:
        id:
          type: string
          description: ID của cuốn sách
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          description: Tiêu đề cuốn sách
          example: "Số Đỏ"
        author:
          type: string
          description: Tác giả
          example: "Vũ Trọng Phụng"
        publishedYear:
          type: integer
          description: Năm xuất bản
          example: 1936
        isbn:
          type: string
          description: Mã số sách chuẩn quốc tế
          example: "978-604-1-08108-4"

    BookInput:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          description: Tiêu đề cuốn sách
          example: "Số Đỏ"
        author:
          type: string
          description: Tác giả
          example: "Vũ Trọng Phụng"
        publishedYear:
          type: integer
          description: Năm xuất bản
          example: 1936
        isbn:
          type: string
          description: Mã số sách chuẩn quốc tế
          example: "978-604-1-08108-4"

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: "ERR_NOT_FOUND"
        message:
          type: string
          example: "Book with the specified ID was not found."
