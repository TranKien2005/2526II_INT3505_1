openapi: 3.0.3
info:
  title: Library Management API
  version: 1.0.0
paths:
  /books:
    get:
      summary: Lấy danh sách sách
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      summary: Thêm sách mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Lấy thông tin sách
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Not Found
    delete:
      summary: Xóa sách
      responses:
        '204':
          description: No Content
components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        year:
          type: integer
    BookInput:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        year:
          type: integer
      required:
        - title
        - author
